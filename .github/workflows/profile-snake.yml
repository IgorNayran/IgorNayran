name: Generate profile contribution animation

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322d3ee&color_dots=%230b1220,%230e7490,%2306b6d4,%2338bdf8,%238b5cf6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2367e8f9&color_dots=%230b1220,%230e7490,%2306b6d4,%2338bdf8,%238b5cf6

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
