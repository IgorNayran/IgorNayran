<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040a"/>
      <stop offset="0.45" stop-color="#07101d"/>
      <stop offset="1" stop-color="#050611"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#67e8f9" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" flood-color="#38bdf8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#centerGlow)"/>

  <!-- Far stars -->
  <g fill="#94a3b8" opacity="0.34">
    <circle cx="34" cy="42" r="1"/><circle cx="102" cy="88" r="0.8"/><circle cx="166" cy="28" r="1.1"/>
    <circle cx="224" cy="111" r="0.7"/><circle cx="292" cy="61" r="1"/><circle cx="358" cy="37" r="0.8"/>
    <circle cx="431" cy="99" r="1"/><circle cx="508" cy="29" r="0.9"/><circle cx="575" cy="73" r="0.7"/>
    <circle cx="648" cy="45" r="1"/><circle cx="718" cy="106" r="0.8"/><circle cx="786" cy="23" r="1"/>
    <circle cx="852" cy="79" r="0.7"/><circle cx="922" cy="48" r="1.1"/><circle cx="996" cy="104" r="0.8"/>
    <circle cx="1071" cy="31" r="1"/><circle cx="1144" cy="83" r="0.8"/><circle cx="1191" cy="52" r="0.7"/>
    <circle cx="73" cy="156" r="0.8"/><circle cx="147" cy="138" r="0.7"/><circle cx="266" cy="173" r="1"/>
    <circle cx="376" cy="145" r="0.8"/><circle cx="835" cy="152" r="0.7"/><circle cx="958" cy="170" r="1"/>
    <circle cx="1084" cy="142" r="0.8"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-70 0" dur="26s" repeatCount="indefinite"/>
  </g>

  <!-- Mid stars -->
  <g fill="#e2e8f0" opacity="0.56">
    <circle cx="51" cy="121" r="1.25"/><circle cx="191" cy="70" r="1.1"/><circle cx="333" cy="128" r="1.25"/>
    <circle cx="456" cy="54" r="1.15"/><circle cx="746" cy="61" r="1.2"/><circle cx="873" cy="126" r="1.1"/>
    <circle cx="1034" cy="67" r="1.25"/><circle cx="1170" cy="118" r="1.1"/>
    <circle cx="134" cy="198" r="1.1"/><circle cx="276" cy="212" r="1.25"/><circle cx="918" cy="204" r="1.1"/>
    <circle cx="1116" cy="193" r="1.2"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Near glowing stars -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <circle cx="92" cy="54" r="1.6" opacity="0.9"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="146" r="1.5" opacity="0.75"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="92" r="1.7" opacity="0.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1137" cy="157" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/></circle>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting stars -->
  <g transform="rotate(18 600 150)" filter="url(#softGlow)">
    <line x1="-250" y1="20" x2="-80" y2="20" stroke="url(#shoot)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1650 0" dur="5.8s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="-520" y1="108" x2="-390" y2="108" stroke="url(#shoot)" stroke-width="1.4" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1760 0" dur="7.4s" begin="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="-420" y1="190" x2="-260" y2="190" stroke="url(#shoot)" stroke-width="1.8" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1720 0" dur="6.6s" begin="5.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Horizon / 3D grid -->
  <line x1="160" y1="219" x2="1040" y2="219" stroke="url(#horizon)" stroke-width="1.2"/>
  <g stroke="#38bdf8" stroke-opacity="0.10" fill="none">
    <path d="M600 219 L0 300"/><path d="M600 219 L150 300"/><path d="M600 219 L300 300"/>
    <path d="M600 219 L450 300"/><path d="M600 219 L750 300"/><path d="M600 219 L900 300"/>
    <path d="M600 219 L1050 300"/><path d="M600 219 L1200 300"/>
    <path d="M0 236 H1200"/><path d="M0 255 H1200"/><path d="M0 278 H1200"/>
  </g>

  <!-- Center content -->
  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="118" fill="#f8fafc" font-size="40" font-weight="700" letter-spacing="7" filter="url(#textGlow)">IGOR NAYRAN</text>
    <text x="600" y="151" fill="#7dd3fc" font-size="14" font-weight="600" letter-spacing="4">SOFTWARE DEVELOPER &amp; BUILDER</text>
    <text x="600" y="181" fill="#94a3b8" font-size="12" letter-spacing="2.2">BUSINESS SYSTEMS • ERP • POS • MOBILE • APIs • AUTOMATION</text>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#334155" stroke-opacity="0.35"/>
</svg>